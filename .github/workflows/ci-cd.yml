name: CI-CD Puente Gamarra

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias (npm ci)
        run: npm ci
      - name: Verificar sintaxis del proyecto
        run: npm run build

  test:
    name: 2. Pruebas automatizadas
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas unitarias y de integración (Jest + Supertest)
        run: npx jest --ci --coverage --verbose
      - name: Publicar resumen de cobertura
        if: always()
        run: |
          node -e "const c=require('./coverage/coverage-summary.json').total;const l=['## Resultados de las pruebas','','| Métrica | Cobertura |','|---|---|'];for(const k of ['lines','statements','functions','branches'])l.push('| '+k+' | '+c[k].pct+' % |');console.log(l.join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/

  seguridad:
    name: 3. Análisis de seguridad
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Análisis de dependencias (npm audit, falla con vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high
      - name: Escaneo de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST - inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: SAST - analizar el código con CodeQL
        uses: github/codeql-action/analyze@v3

  deploy:
    name: 4. Deploy a Render (producción)
    needs: [test, seguridad]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Disparar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL"; exit 1; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Despliegue solicitado a Render."
      - name: Verificar que la aplicación responde
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL no está configurada; se omite la verificación."; exit 0; fi
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/salud"; then echo; echo "La aplicación responde en $APP_URL"; exit 0; fi
            sleep 10
          done
          echo "::error::La aplicación no respondió"; exit 1
